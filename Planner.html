<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Planner</title>
</head>
<body>
    <div class = "planner">
        <div class = "header">
            <div>
                <h1>My Planner</h1>
                <p>Stay organized. Get things done.</p>
            </div>
        <div class="date" id="currentDate"></div>
        </div>
        <div class = "progress-section">
            <div class = "progress-info">
                <span>Progress</span>
                <span id="progressPercent">60%</span>
            </div>
            <div class = "progress-bar">
                <div class = "progress" id="progressBar">
                </div>
            </div>
            <p id="progressText">3 out of 5 tasks completed</p>
        </div>
        <div class = "add-tasks">
            <input 
            id="taskInput"
            type = "text" 
            placeholder="Add new task...">
            <button id="addBtn">
                + Add Task
            </button>
        </div>

     <div class="tasks" id="taskList">

    <div id="emptyState">

        <h4>
            🌱<br>
            Nothing planned<br>
            yet
        </h4>

        <p>Add your first task and start growing your day.</p>

    </div>

    <div id="footerQuote" class="footer-quote">
        ✨ Small progress, big results.
    </div>

</div>
</div>
        </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
